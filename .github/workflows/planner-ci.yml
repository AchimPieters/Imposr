name: Planner CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  planner-build-test:
    name: ${{ matrix.os }} / ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        build_type: [Release]
        include:
          - os: ubuntu-latest
            cxx_flags: -Wall -Wextra -Wpedantic
          - os: macos-latest
            cxx_flags: -Wall -Wextra -Wpedantic
          - os: windows-latest
            cxx_flags: /W4

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build
          -DAIMP_BUILD_PLUGIN=OFF
          -DAIMP_BUILD_TESTS=ON
          -DAIMP_BUILD_CLI=ON
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_CXX_FLAGS="${{ matrix.cxx_flags }}"

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }}

      - name: Test
        run: ctest --test-dir build --build-config ${{ matrix.build_type }} --output-on-failure
